name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml

  release:
    name: build and publish
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # bin/package builds the four tar.gz archives (binary, launcher, adapters/ and docs in one tree) and the
      # Windows zip (bbapprove.exe and docs in one folder), then writes SHA256SUMS. `bbapprove --update` relies on
      # these names.
      - name: Build archives
        env:
          TAG: ${{ github.ref_name }}
        run: bin/package "$TAG" --out dist

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: bin/release-notes "$TAG" > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --title "bbapprove $TAG" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
