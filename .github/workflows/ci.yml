name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The shell suites need bash >= 4 (mapfile) and ripgrep (test/lib/bash_test.sh); bin/lint needs shellcheck and, to enforce shell formatting, shfmt.
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep shellcheck shfmt jq

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash ripgrep shellcheck shfmt jq
          # Homebrew's bin first on PATH, so `#!/usr/bin/env bash` finds bash 5 instead of macOS's 3.2.
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          for tool in bash go gofmt shellcheck shfmt rg jq git; do
            command -v "$tool" || { echo "missing: $tool" >&2; exit 1; }
          done
          bash --version | head -n 1
          go version
          shellcheck --version | sed -n 2p
          shfmt --version
          rg --version | head -n 1
          jq --version

      - name: Lint
        run: bin/lint

      - name: Test
        run: bin/test

  # Informational: lists what breaks on Windows before porting. Remove continue-on-error once this job is
  # green and the Windows work is done, so a failure blocks merging again.
  go-windows:
    name: go tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        continue-on-error: true
        run: go build ./...

      - name: Vet
        shell: bash
        continue-on-error: true
        run: go vet ./...

      - name: Test
        shell: bash
        continue-on-error: true
        run: go test -count=1 ./...
