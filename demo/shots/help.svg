<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg width="835.00" height="654.00" xmlns="http://www.w3.org/2000/svg">
<rect width="835.00" height="654.00" fill="#171717" x="0.00px" y="0.00px"/>
<g font-family="JetBrains Mono, Menlo, Consolas, &apos;DejaVu Sans Mono&apos;, monospace" font-size="14.00px" fill="#c4c4c4" clip-path="url(#terminalMask)">
<text x="20.00px" y="51.80px" xml:space="preserve"><tspan xml:space="preserve">bbapprove v1.2.0 — approve and merge Renovate PRs on Bitbucket Server.</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="68.60px" xml:space="preserve"/><text x="20.00px" y="85.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#04D7D7">Usage:</tspan><tspan xml:space="preserve"> bbapprove [</tspan><tspan xml:space="preserve" fill="#31BB71">--apply</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--hide-ignored</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--disallow</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">a,b</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--token-name</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">NAME</tspan><tspan xml:space="preserve">]</tspan></text><text x="20.00px" y="102.20px" xml:space="preserve"><tspan xml:space="preserve">                 [</tspan><tspan xml:space="preserve" fill="#31BB71">--config</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">FILE</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--print-config</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">-i</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--no-mouse</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#8F69FF">PR_URL...</tspan><tspan xml:space="preserve">]</tspan></text><text x="20.00px" y="119.00px" xml:space="preserve"><tspan xml:space="preserve">       bbapprove </tspan><tspan xml:space="preserve" fill="#31BB71">--init</tspan><tspan xml:space="preserve"> [</tspan><tspan xml:space="preserve" fill="#31BB71">--force</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--config</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">FILE</tspan><tspan xml:space="preserve">]</tspan></text><text x="20.00px" y="135.80px" xml:space="preserve"><tspan xml:space="preserve">       bbapprove </tspan><tspan xml:space="preserve" fill="#ED61D7">doctor</tspan><tspan xml:space="preserve"> [</tspan><tspan xml:space="preserve" fill="#31BB71">-v</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--offline</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--config</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">FILE</tspan><tspan xml:space="preserve">]</tspan></text><text x="20.00px" y="152.60px" xml:space="preserve"><tspan xml:space="preserve">       bbapprove </tspan><tspan xml:space="preserve" fill="#31BB71">--outdated</tspan><tspan xml:space="preserve"> [</tspan><tspan xml:space="preserve" fill="#31BB71">--pre</tspan><tspan xml:space="preserve">]</tspan></text><text x="20.00px" y="169.40px" xml:space="preserve"><tspan xml:space="preserve">       bbapprove </tspan><tspan xml:space="preserve" fill="#31BB71">--update</tspan><tspan xml:space="preserve"> [</tspan><tspan xml:space="preserve" fill="#31BB71">--yes</tspan><tspan xml:space="preserve">] [</tspan><tspan xml:space="preserve" fill="#31BB71">--pre</tspan><tspan xml:space="preserve">]</tspan></text><text x="20.00px" y="186.20px" xml:space="preserve"/><text x="20.00px" y="203.00px" xml:space="preserve"><tspan xml:space="preserve">Dry run by default: with no </tspan><tspan xml:space="preserve" fill="#8F69FF">PR_URL</tspan><tspan xml:space="preserve"> every open PR where you are a reviewer is listed and only</tspan></text><text x="20.00px" y="219.80px" xml:space="preserve"><tspan xml:space="preserve">eligibility is reported. Nothing changes without </tspan><tspan xml:space="preserve" fill="#31BB71">--apply</tspan><tspan xml:space="preserve">.</tspan></text><text x="20.00px" y="236.60px" xml:space="preserve"/><text x="20.00px" y="253.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#04D7D7">Options:</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="270.20px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--apply</tspan><tspan xml:space="preserve">            approve, then merge, the eligible PRs</tspan></text><text x="20.00px" y="287.00px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--hide-ignored</tspan><tspan xml:space="preserve">     leave ignored PRs out of the table</tspan></text><text x="20.00px" y="303.80px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--disallow</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">a,b</tspan><tspan xml:space="preserve">     also skip PRs whose title mentions these dependencies</tspan></text><text x="20.00px" y="320.60px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--token-name</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">NAME</tspan><tspan xml:space="preserve">  1Password item that holds the API token</tspan></text><text x="20.00px" y="337.40px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--config</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">FILE</tspan><tspan xml:space="preserve">      use this config file</tspan></text><text x="20.00px" y="354.20px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--print-config</tspan><tspan xml:space="preserve">     show the effective settings and where each came from (no secrets)</tspan></text><text x="20.00px" y="371.00px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--init</tspan><tspan xml:space="preserve">             create the config file from the template (</tspan><tspan xml:space="preserve" fill="#31BB71">--force</tspan><tspan xml:space="preserve"> replaces one)</tspan></text><text x="20.00px" y="387.80px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">-i</tspan><tspan xml:space="preserve">                 interactive TUI (</tspan><tspan xml:space="preserve" fill="#31BB71">--no-mouse</tspan><tspan xml:space="preserve"> turns mouse capture off)</tspan></text><text x="20.00px" y="404.60px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--outdated</tspan><tspan xml:space="preserve">         check whether a newer release exists (</tspan><tspan xml:space="preserve" fill="#31BB71">--pre</tspan><tspan xml:space="preserve"> includes pre-releases)</tspan></text><text x="20.00px" y="421.40px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">--update</tspan><tspan xml:space="preserve">           update after showing a plan (</tspan><tspan xml:space="preserve" fill="#31BB71">--yes</tspan><tspan xml:space="preserve"> skips the question)</tspan></text><text x="20.00px" y="438.20px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">-V</tspan><tspan xml:space="preserve">, </tspan><tspan xml:space="preserve" fill="#31BB71">--version</tspan><tspan xml:space="preserve">      print the version</tspan></text><text x="20.00px" y="455.00px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#31BB71">-h</tspan><tspan xml:space="preserve">, </tspan><tspan xml:space="preserve" fill="#31BB71">--help</tspan><tspan xml:space="preserve">         this help</tspan></text><text x="20.00px" y="471.80px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#ED61D7">doctor</tspan><tspan xml:space="preserve">             diagnose the installation and the configuration</tspan></text><text x="20.00px" y="488.60px" xml:space="preserve"/><text x="20.00px" y="505.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#04D7D7">Topics:</tspan><tspan xml:space="preserve"> bbapprove </tspan><tspan xml:space="preserve" fill="#ED61D7">help</tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#8F69FF">TOPIC</tspan><tspan xml:space="preserve"/></text><text x="20.00px" y="522.20px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#ED61D7">rules</tspan><tspan xml:space="preserve">   which PRs are eligible, the ignore list, the STATUS column</tspan></text><text x="20.00px" y="539.00px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#ED61D7">tui</tspan><tspan xml:space="preserve">     the interactive TUI: columns, status bar, exit summary, mouse</tspan></text><text x="20.00px" y="555.80px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#ED61D7">config</tspan><tspan xml:space="preserve">  config file lookup, precedence, first run, --init, --print-config</tspan></text><text x="20.00px" y="572.60px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#ED61D7">token</tspan><tspan xml:space="preserve">   where the API token comes from</tspan></text><text x="20.00px" y="589.40px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#ED61D7">update</tspan><tspan xml:space="preserve">  --outdated and --update</tspan></text><text x="20.00px" y="606.20px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#ED61D7">env</tspan><tspan xml:space="preserve">     environment variables and exit codes</tspan></text><text x="20.00px" y="623.00px" xml:space="preserve"><tspan xml:space="preserve">  </tspan><tspan xml:space="preserve" fill="#ED61D7">doctor</tspan><tspan xml:space="preserve">  bbapprove doctor, the diagnostics report</tspan></text>
</g>
